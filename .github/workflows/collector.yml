name: collector

on:
  schedule:
    # Three times an hour, deliberately off the top of the hour. GitHub runs
    # scheduled workflows on a best-effort basis and its own docs single out
    # "the start of every hour" as the high-load window to avoid, so :00 is
    # the worst minute to ask for. "*/20" lands on :00 and was not honoured
    # for over an hour; :07/:27/:47 keeps three chances an hour off-peak.
    #
    # The earlier "17 */6 * * *" gave only four chances a day, so each slip
    # left a multi-hour hole: the job ran its 350 minutes, exited, and nothing
    # collected until the next fire landed.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      testsms:
        description: "Send one test text instead of running the collector loop"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: collector
  # Never kill a healthy collector to start another one. A new run waits for
  # the current one to finish and then takes over, so coverage is continuous.
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install protobuf bindings
        run: pip install gtfs-realtime-bindings protobuf

      - name: Run collector loop
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          git config user.name "hopscotch-bot"
          git config user.email "actions@github.com"
          if [ "${{ github.event.inputs.testsms }}" = "true" ]; then
            python3 collector.py testsms
          else
            python3 collector.py loop 25
          fi
