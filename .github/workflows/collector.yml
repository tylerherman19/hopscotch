name: collector

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      testsms:
        description: "Send one test text instead of running the collector loop"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install protobuf bindings
        run: pip install gtfs-realtime-bindings protobuf

      - name: Run collector loop
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          git config user.name "hopscotch-bot"
          git config user.email "actions@github.com"
          if [ "${{ github.event.inputs.testsms }}" = "true" ]; then
            python3 collector.py testsms
          else
            python3 collector.py loop 350
          fi
