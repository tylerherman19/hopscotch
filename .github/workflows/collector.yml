name: collector

on:
  schedule:
    # Asking three times an hour does not get three runs an hour. Measured over
    # 14 hours, GitHub honoured 4 of ~43 requested fires: it services this
    # workflow roughly every 3-4 hours no matter how often the cron asks.
    #
    # So the loop length, not the cron frequency, is what determines coverage.
    # Each run collects for its full 350 minutes and the next fire queues
    # behind it (see concurrency below), which is what keeps the feed
    # continuous. Keeping a frequent cron only means a run that does land has
    # a good chance of landing soon after the previous one ended.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      testsms:
        description: "Send one test text instead of running the collector loop"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  # The loop owns one group so a new run waits for the current one and takes
  # over, keeping coverage continuous rather than killing a healthy collector.
  # The testsms dispatch gets its own group: it is a five-second job and has no
  # business queueing behind up to 25 minutes of collecting.
  group: collector-${{ github.event.inputs.testsms == 'true' && 'testsms' || 'loop' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install protobuf bindings
        run: pip install gtfs-realtime-bindings protobuf

      - name: Run collector loop
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          git config user.name "hopscotch-bot"
          git config user.email "actions@github.com"
          if [ "${{ github.event.inputs.testsms }}" = "true" ]; then
            python3 collector.py testsms
          else
            python3 collector.py loop 350
          fi
