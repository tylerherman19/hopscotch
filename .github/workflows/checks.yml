name: Transit checks
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['data/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: pip install gtfs-realtime-bindings protobuf
      - run: node --check app.js && node --check transit.js && node --check journey.js && node --check experience.js
      - run: npm test
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile collector.py build_static.py
