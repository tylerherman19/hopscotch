<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Spokes · Hopscotch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f4f1; --panel:#fbfcfa; --ink:#101511; --muted:#66705f;
  --hair:#dfe3da; --hair2:#c6ccbf; --red:#eb0000;
  --ease:cubic-bezier(.2,.7,.2,1); --settle:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.frozen *,.frozen *:before,.frozen *:after{transition:none!important;animation:none!important}
html,body{height:100%;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;overflow:hidden}
.serif{font-family:Fraunces,serif}

#mast{position:fixed;top:0;left:0;right:0;height:54px;background:var(--panel);
  border-bottom:1px solid var(--hair);display:flex;align-items:center;padding:0 14px;z-index:30;gap:10px}
#mast .wm{font-family:Fraunces,serif;font-weight:700;font-size:17px;letter-spacing:-.01em}
#mast .wm em{font-style:italic;font-weight:500;color:var(--muted);font-size:11px}
#mast .feed{margin-left:auto;font-size:10px;color:var(--muted);letter-spacing:.06em;text-align:right;line-height:1.5}
#mast .feed b{color:var(--ink);font-weight:500}
#mast .feed .live-dot{color:var(--red)}
#status{position:fixed;top:54px;left:0;right:0;z-index:25;background:var(--paper);
  border-bottom:1px solid var(--hair);padding:6px 14px;font-size:11px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status b{color:var(--ink)}

#stage{position:fixed;top:91px;left:0;right:0;bottom:0}
#wheel{width:100%;height:100%;display:block}
.spoke-ghost{stroke:#e2e6dd;stroke-width:1}
.spoke-live{stroke-width:2;cursor:pointer;transition:opacity 420ms var(--ease),stroke-width 240ms var(--ease)}
.spoke-lab{font-family:"IBM Plex Mono",monospace;font-size:9px;fill:var(--muted);cursor:pointer;
  transition:opacity 420ms var(--ease)}
.spoke-lab b{fill:var(--ink);font-weight:500}
.veh circle{stroke:var(--panel);stroke-width:1.3}
.veh{transition:opacity 240ms var(--ease)}
#stage.dim .spoke-live{opacity:.1}
#stage.dim .spoke-live.sel{opacity:1;stroke-width:3.4}
#stage.dim .spoke-lab{opacity:.18}
#stage.dim .spoke-lab.sel{opacity:1}
#stage.dim .veh{opacity:.08}
#stage.dim .veh.sel{opacity:1}
.hub-count{font-family:Fraunces,serif;font-weight:700;fill:var(--ink)}
.hub-lab{font-family:"IBM Plex Mono",monospace;font-size:8px;letter-spacing:.18em;fill:var(--muted)}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);
  border-top:1px solid var(--hair2);max-height:58%;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform 420ms var(--ease)}
#sheet.open{transform:none}
#sheet .grab{width:36px;height:3px;background:var(--hair2);margin:8px auto 2px}
#sheet .head{padding:8px 16px 10px;border-bottom:1px solid var(--hair);display:flex;align-items:baseline;gap:10px}
#sheet .head .rt{font-family:Fraunces,serif;font-weight:700;font-size:24px}
#sheet .head .nm{font-size:11px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheet .head .x{font-size:11px;color:var(--muted);cursor:pointer;padding:4px}
#rows{overflow-y:auto;padding:4px 0 16px}
.row{display:flex;align-items:baseline;gap:10px;padding:10px 16px;border-bottom:1px solid var(--hair);
  opacity:0;transform:translateY(8px)}
.row.in{opacity:1;transform:none;transition:opacity 420ms var(--ease),transform 420ms var(--ease)}
.row .sn{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .via{font-size:9px;color:var(--muted)}
.row .eta{font-size:14px;font-weight:500}
.row .eta small{font-size:9px;color:var(--muted)}
.row.hot .eta{color:var(--red)}
#empty{padding:18px 16px;font-size:11px;color:var(--muted)}
#hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:9px;
  letter-spacing:.14em;color:var(--muted);z-index:20;pointer-events:none}
</style>
</head>
<body>
<header id="mast">
  <div class="wm">The Spokes <em>· every line leaves downtown</em></div>
  <div class="feed" id="feed">CONNECTING</div>
</header>
<div id="status"></div>
<div id="stage"><svg id="wheel" preserveAspectRatio="xMidYMid meet"></svg></div>
<div id="hint">TAP A SPOKE FOR ARRIVALS</div>
<div id="sheet">
  <div class="grab"></div>
  <div class="head"><span class="rt" id="srt"></span><span class="nm" id="snm"></span><span class="x" id="sx">CLOSE</span></div>
  <div id="rows"></div>
</div>
<script src="hop-core.js"></script>
<script>
(function(){
"use strict";
const HC = window.HOPCORE, M = HC.MOTION;
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("wheel");
const stage = document.getElementById("stage");
let S, tracker = HC.makeTracker(), sel=null, layout={}, shapeCache={};
const CXF=0.5, CYF=0.47;

function shapeFrac(rid, lat, lon){
  if(!shapeCache[rid]){
    const sh = S.shapes[rid]; if(!sh) return null;
    const dirs = Object.values(sh);
    const pts = dirs.sort((a,b)=>b.length-a.length)[0].map(p=>[p[1],p[0]]);
    shapeCache[rid] = {pts, m: HC.polylineMetrics(pts)};
  }
  const c = shapeCache[rid];
  return HC.projectFrac(c.pts, c.m, lat, lon);
}
function routeLen(rid){
  if(!shapeCache[rid]) shapeFrac(rid,0,0);
  return shapeCache[rid] ? shapeCache[rid].m.total : 0;
}

function build(live){
  const w = stage.clientWidth, h = stage.clientHeight;
  svg.setAttribute("viewBox","0 0 "+w+" "+h);
  svg.innerHTML = "";
  const cx = w*CXF, cy = h*CYF, R = Math.min(w,h)*0.43, hubR = 34;
  const seen = {};
  live.vehicles.forEach(v=>seen[v.route]=true);
  const liveRts = Object.keys(seen).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const allRts = S.routes.map(r=>r.id);
  const lens = liveRts.map(routeLen);
  const maxLen = Math.max.apply(null, lens.concat([1]));
  layout = {cx,cy,R,hubR,routes:{}};
  liveRts.forEach((rid,i)=>{
    const ang = -Math.PI/2 + i*2*Math.PI/liveRts.length;
    const len = R*(0.5 + 0.5*(routeLen(rid)/maxLen));
    layout.routes[rid] = {ang, len, i};
  });
  /* ghost wheel: every route the city owns */
  const gG = document.createElementNS(NS,"g"); svg.appendChild(gG);
  allRts.forEach((rid,i)=>{
    if(liveRts.indexOf(rid)>=0) return;
    const ang = -Math.PI/2 + i*2*Math.PI/allRts.length;
    const l = document.createElementNS(NS,"line");
    l.setAttribute("x1",cx+Math.cos(ang)*hubR); l.setAttribute("y1",cy+Math.sin(ang)*hubR);
    l.setAttribute("x2",cx+Math.cos(ang)*R*0.34); l.setAttribute("y2",cy+Math.sin(ang)*R*0.34);
    l.setAttribute("class","spoke-ghost");
    gG.appendChild(l);
  });
  const gL = document.createElementNS(NS,"g"); svg.appendChild(gL);
  const gLab = document.createElementNS(NS,"g"); svg.appendChild(gLab);
  const gV = document.createElementNS(NS,"g"); gV.id="gveh"; svg.appendChild(gV);
  liveRts.forEach((rid,i)=>{
    const L = layout.routes[rid];
    const x1 = cx+Math.cos(L.ang)*hubR, y1 = cy+Math.sin(L.ang)*hubR;
    const x2 = cx+Math.cos(L.ang)*L.len, y2 = cy+Math.sin(L.ang)*L.len;
    const l = document.createElementNS(NS,"line");
    l.setAttribute("x1",x1); l.setAttribute("y1",y1); l.setAttribute("x2",x2); l.setAttribute("y2",y2);
    l.setAttribute("class","spoke-live"); l.style.stroke = HC.routeColor(rid); l.dataset.rid=rid;
    l.addEventListener("click",()=>select(rid));
    gL.appendChild(l);
    HC.drawOn(l, 500, 300+i*45);
    const lx = cx+Math.cos(L.ang)*(L.len+14), ly = cy+Math.sin(L.ang)*(L.len+14);
    const t = document.createElementNS(NS,"text");
    t.setAttribute("x",lx); t.setAttribute("y",ly+3);
    t.setAttribute("text-anchor", Math.abs(Math.cos(L.ang))<0.35 ? "middle" : (Math.cos(L.ang)>0?"start":"end"));
    t.setAttribute("class","spoke-lab"); t.dataset.rid=rid;
    t.textContent = rid;
    t.addEventListener("click",()=>select(rid));
    gLab.appendChild(t);
  });
  /* hub */
  const hub = document.createElementNS(NS,"g");
  const c = document.createElementNS(NS,"circle");
  c.setAttribute("cx",cx); c.setAttribute("cy",cy); c.setAttribute("r",hubR);
  c.style.fill = "#fbfcfa"; c.style.stroke = "#101511"; c.style.strokeWidth = "2";
  hub.appendChild(c);
  const n = live.vehicles.length + (live.hop||[]).length;
  const t1 = document.createElementNS(NS,"text");
  t1.setAttribute("x",cx); t1.setAttribute("y",cy+9); t1.setAttribute("text-anchor","middle");
  t1.setAttribute("class","hub-count"); t1.setAttribute("font-size","26"); t1.id="hubn";
  t1.textContent = "0";
  hub.appendChild(t1);
  const t2 = document.createElementNS(NS,"text");
  t2.setAttribute("x",cx); t2.setAttribute("y",cy+22); t2.setAttribute("text-anchor","middle");
  t2.setAttribute("class","hub-lab"); t2.textContent = "LIVE";
  hub.appendChild(t2);
  svg.appendChild(hub);
  /* hub draws itself, then the count rolls */
  HC.drawOn(c, 620, 60);
  setTimeout(()=>{ HC.countUp({ _cv:0, set textContent(v){t1.textContent=v;}, get textContent(){return t1.textContent;} }, n); }, 500);
  return liveRts;
}

function paintVehicles(live, first){
  const gV = document.getElementById("gveh");
  const keys = [];
  live.vehicles.forEach(v=>{
    const L = layout.routes[v.route]; if(!L) return;
    const f = shapeFrac(v.route, v.lat, v.lon); if(f===null) return;
    const key="b"+v.id; keys.push(key);
    tracker.set(key,f);
    let g = document.getElementById(key);
    if(!g){
      g = document.createElementNS(NS,"g");
      g.setAttribute("class","veh"); g.id=key; g.dataset.rid=v.route;
      const c = document.createElementNS(NS,"circle");
      c.setAttribute("r","3.6"); c.style.fill = HC.routeColor(v.route);
      g.appendChild(c);
      g.addEventListener("click",()=>select(v.route));
      gV.appendChild(g);
      if(first){ g.style.opacity="0"; setTimeout(()=>{g.style.opacity="1";}, 900+Math.random()*900); }
    }
    g.dataset.fracKey=key;
  });
  (live.hop||[]).forEach(hv=>{
    /* the Hop orbits the hub: fixed short spoke at its own angle */
    if(!layout.routes["HOP"]){
      layout.routes["HOP"] = {ang: Math.PI/2 + 0.35, len: layout.R*0.32};
    }
    const key="h"+hv.id; keys.push(key);
    tracker.set(key, 0.3+0.4*((hv.id%5)/5));
    let g = document.getElementById(key);
    if(!g){
      g = document.createElementNS(NS,"g");
      g.setAttribute("class","veh"); g.id=key; g.dataset.rid="HOP";
      const r = document.createElementNS(NS,"rect");
      r.setAttribute("width","7"); r.setAttribute("height","7"); r.setAttribute("x","-3.5"); r.setAttribute("y","-3.5");
      r.style.fill = HC.routeColor("HOP"); r.style.stroke="#fbfcfa"; r.style.strokeWidth="1.2";
      g.appendChild(r);
      gV.appendChild(g);
      if(first){ g.style.opacity="0"; setTimeout(()=>{g.style.opacity="1";}, 900+Math.random()*900); }
    }
    g.dataset.fracKey=key;
  });
  Array.from(gV.children).forEach(g=>{ if(keys.indexOf(g.id)<0) g.remove(); });
}

function frame(){
  const gV = document.getElementById("gveh");
  if(gV){
    tracker.tick();
    Array.from(gV.children).forEach(g=>{
      const key=g.dataset.fracKey; if(!key) return;
      const f = tracker.get(key); if(f===null) return;
      const L = layout.routes[g.dataset.rid]; if(!L) return;
      const r = layout.hubR + (L.len-layout.hubR)*f;
      const x = layout.cx+Math.cos(L.ang)*r, y = layout.cy+Math.sin(L.ang)*r;
      g.setAttribute("transform","translate("+x.toFixed(2)+","+y.toFixed(2)+")");
    });
  }
  requestAnimationFrame(frame);
}

function arrivalsFor(rid, live){
  const rows = {}; const now = Date.now()/1000;
  live.vehicles.filter(v=>v.route===rid).forEach(v=>(v.next||[]).slice(0,3).forEach(n=>{
    const mins = Math.max(0, Math.round((n.at-now)/60));
    if(!rows[n.stop] || rows[n.stop].mins>mins) rows[n.stop]={name:n.name,mins,bus:v.id};
  }));
  return Object.values(rows).sort((a,b)=>a.mins-b.mins).slice(0,9);
}
function select(rid){
  sel=rid;
  stage.classList.add("dim");
  document.querySelectorAll(".spoke-live").forEach(p=>p.classList.toggle("sel",p.dataset.rid===rid));
  document.querySelectorAll(".spoke-lab").forEach(p=>p.classList.toggle("sel",p.dataset.rid===rid));
  document.querySelectorAll(".veh").forEach(g=>g.classList.toggle("sel",g.dataset.rid===rid));
  document.getElementById("srt").textContent = "Route "+rid;
  document.getElementById("srt").style.color = HC.routeColor(rid);
  document.getElementById("snm").textContent = HC.routeName(rid);
  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  const list = arrivalsFor(rid, HC.LIVE);
  if(!list.length){ rows.innerHTML = '<div id="empty">No stop predictions on this spoke right now.</div>'; }
  list.forEach((r,i)=>{
    const d = document.createElement("div");
    d.className = "row"+(r.mins<=2?" hot":"");
    d.innerHTML = '<span class="sn">'+r.name.toLowerCase()+'</span><span class="via">bus '+r.bus+'</span><span class="eta">'+r.mins+'<small> MIN</small></span>';
    rows.appendChild(d);
    setTimeout(()=>d.classList.add("in"), 120+i*60);
  });
  document.getElementById("sheet").classList.add("open");
}
function closeSheet(){
  sel=null;
  stage.classList.remove("dim");
  document.querySelectorAll(".sel").forEach(e=>e.classList.remove("sel"));
  document.getElementById("sheet").classList.remove("open");
}
document.getElementById("sx").addEventListener("click", closeSheet);
svg.addEventListener("click", e=>{ if(e.target===svg) closeSheet(); });

function feedLine(live){
  const el = document.getElementById("feed");
  const n = live.vehicles.length+(live.hop||[]).length;
  const age = Math.max(0,Math.round((Date.now()-live.ts*1000)/1000));
  el.innerHTML = '<span class="live-dot">LIVE</span> · <b>'+n+'</b> OUT · <b>'+age+'S</b> AGO';
}
function statusLine(live){
  const late = live.counts?live.counts.late10:0;
  document.getElementById("status").innerHTML =
    '<b>'+live.status+'.</b> '+late+' buses 10+ late, still circling the same downtown';
}

(async function boot(){
  S = await HC.loadStatic();
  const live = await HC.loadLive();
  build(live);
  paintVehicles(live, true);
  feedLine(live); statusLine(live);
  requestAnimationFrame(frame);
  setInterval(async ()=>{
    try{
      const l2 = await HC.loadLive();
      paintVehicles(l2, false);
      feedLine(l2); statusLine(l2);
      const t1 = document.getElementById("hubn");
      if(t1) t1.textContent = String(l2.vehicles.length+(l2.hop||[]).length);
      if(sel) select(sel);
    }catch(e){}
  }, 30000);
})();
})();
</script>
</body>
</html>
